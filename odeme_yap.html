<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Datariders - Güvenli Ödeme</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .payment-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 400px; }
        .total-box { background: #1a73e8; color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-pay { background: #34a853; color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="payment-card">
        <div class="total-box">
            <span>Ödenecek Toplam Tutar</span>
            <h2 style="margin: 5px 0;">{{ toplam }} TL</h2>
        </div>
<!-- ID bilgisini buraya ekledik ( {{ uye['Id'] }} ) -->
        <form action="/uye-paneli/odeme-tamamla/{{ uye['Id'] }}" method="POST">            <label>Kart Üzerindeki İsim</label>
            <input type="text" placeholder="Ad Soyad" required>
            <label>Kart Numarası</label>
            <input type="text" placeholder="**** **** **** ****" required>
            <div style="display: flex; gap: 10px;">
                <input type="text" placeholder="AA/YY" required>
                <input type="text" placeholder="CVV" required>
            </div>
            <button type="submit" class="btn-pay">{{ toplam }} TL Öde</button>
        </form>
    </div>
</body>
</html>
